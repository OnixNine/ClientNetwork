plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.1.0"
}

group = 'me.onixdev.ircchat'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation(files("nettyLib.jar"))
}

tasks.shadowJar {
    archiveClassifier.set("")
    // Правильный синтаксис релокации для Shadow 9.x
    relocate("io.netty", "dev.test.netty") {
        // Исключаем файлы, которые не надо трогать (опционально)
        exclude "META-INF/**"
        exclude "module-info.class"
    }
    // Если NetLib тоже может конфликтовать — раскомментируй
    // relocate("ru.kseonyt.net", "dev.test.kseonyt")
}

tasks.build.dependsOn tasks.shadowJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava10Compatible()) {
        options.release.set(21)
    }
}